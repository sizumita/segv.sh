# pnpm reads its settings from this file only: not from .npmrc, and not from the "pnpm" field of package.json.

# Apps under apps/ (each one ships), shared code under packages/. Nothing here is published.
packages:
  - apps/*
  - packages/*

# The one version of each third-party package in the workspace: every package.json names "catalog:" instead of a
# version, so that no two packages can drift apart (two copies of @qwik.dev/core in one bundle would break the UI).
# Every entry is an exact version. `pnpm add <name>@<version> --filter <package>` adds a new package here and names
# "catalog:" in that package.json; catalogMode: strict refuses a version other than the one listed here.
catalog:
  "@cloudflare/vite-plugin": 1.66.0
  "@cloudflare/vitest-plugin": 1.4.9
  "@noble/ciphers": 2.4.0
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@noble/post-quantum": 0.7.1
  "@qwik.dev/core": 2.0.0-rc.4
  "@qwik.dev/router": 2.0.0-rc.4
  "@types/node": 25.6.0
  eslint-plugin-qwik: 2.0.0-rc.4
  playwright: 1.64.1
  typescript: 5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  wrangler: 4.154.0
catalogMode: strict
# An entry that no package names any more is deleted.
catalogPrune: true

# Dependencies between workspace packages go one way only (docs/DEVELOPMENT.md, "Workspace").
disallowWorkspaceCycles: true

# `pnpm --filter <name>` fails when no package matches, so that a renamed package cannot turn a script (such as the
# root's `deploy`) into one that does nothing and succeeds.
failIfNoMatch: true

# `pnpm add` writes exact versions, so every dependency stays pinned.
saveExact: true

overrides:
  # Vite+ needs every package to resolve vite and vitest to the toolchain's own copies: the catalog's entries, which
  # move with the catalog's vite-plus (`vp toolchain vitest` prints the Vitest version it bundles).
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # @qwik.dev/router 2.0.0-rc.4 pins these packages to versions with security advisories. The deployed Worker contains
  # none of them: @azure/functions serves only the Azure adapter, zod only zod$(), and vite-imagetools only image
  # imports with "?jsx". Each override names the exact version of its parent, so it stops applying when the parent is
  # upgraded; delete it then and run `pnpm audit`.
  "@azure/functions@3.5.1>uuid": 11.1.1 # GHSA-w5hq-g745-h8pq
  "@qwik.dev/router@2.0.0-rc.4>zod": 4.6.6 # GHSA-mrhx-c7xc-m3w5
  vite-imagetools@10.0.0>sharp: 0.35.5 # GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w

# vite resolves to @voidzero-dev/vite-plus-core, whose version (1.x) is outside the vite ranges that plugins declare.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# No dependency runs install scripts. esbuild and workerd take their binaries from platform packages instead.
allowBuilds:
  esbuild: false
  workerd: false

# pnpm neither switches itself to the release that "packageManager" in package.json pins nor records that release in
# pnpm-lock.yaml. The record makes the lockfile two YAML documents, and GitHub's dependency graph reads only the first:
# Dependabot would see no dependencies, raise no alerts and open no security updates. CI checks that the lockfile stays
# one document. Revisit once GitHub reads such lockfiles (dependabot/dependabot-core#15904).
pmOnFail: ignore

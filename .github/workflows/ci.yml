# Checks every pull request: formatting, lint, type checks, tests, the production build, the Wrangler configuration,
# the end-to-end test, the dependencies' advisories and registry signatures, and the format of the lockfile. The audit
# also runs every week, since advisories are published against versions that are already locked. Pushes to main are
# checked by the Deploy workflow.
#
# - No job has secrets, and the GITHUB_TOKEN can only read the repository.
# - Dependencies come from pnpm-lock.yaml, without install scripts and without a cache.
# - pnpm is the release that "packageManager" in package.json pins, installed by pnpm/action-setup. The repository
#   allows only actions created by GitHub, and pnpm/action-setup (docs/DEPLOYMENT.md).
# - Every action is pinned to a full commit SHA.

name: CI

on:
  pull_request:
  schedule:
    # Mondays, 00:00 UTC: the audit only.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

# A newer push to a pull request cancels the run that is still checking the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  # The same checks as the build job of the Deploy workflow.
  check:
    name: Check, test and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format and lint
        run: pnpm run check

      # The rules of the workspace (docs/DEVELOPMENT.md): catalog versions, the direction of dependencies, declared
      # imports, a deduplicated lockfile and satisfied peer dependencies.
      - name: Check the workspace's dependencies
        run: pnpm run check:workspace

      # Every package of the workspace, with its own globals (packages/server sees only the Workers runtime).
      - name: Type-check every package
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # qwik build also type-checks the web app.
      - name: Build
        run: pnpm run build

      - name: Check the Wrangler configuration
        working-directory: apps/web
        run: pnpm exec wrangler deploy --dry-run

  e2e:
    name: End-to-end test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Headless runs need only Chromium's headless shell.
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Builds the app, serves it with wrangler dev, and drives it with headless Chromium.
      - name: End-to-end test
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
        run: pnpm run test:e2e

      - name: Upload the screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7

  # Reads pnpm-lock.yaml only: the project's dependencies are not installed. To accept an advisory, list its GHSA
  # under auditConfig.ignoreGhsas in pnpm-workspace.yaml, with the reason.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # GitHub's dependency graph reads only the first YAML document of pnpm-lock.yaml, so Dependabot sees the
      # dependencies only while the lockfile is a single document (pmOnFail in pnpm-workspace.yaml).
      - name: Check that the lockfile is one YAML document
        run: |
          if grep -qx -- '---' pnpm-lock.yaml; then
            echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml holds more than one YAML document; see pmOnFail in pnpm-workspace.yaml."
            exit 1
          fi

      - name: Check for advisories
        run: pnpm audit

      - name: Verify registry signatures
        run: pnpm audit signatures

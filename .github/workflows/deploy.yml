# Deploys https://segv.sh to Cloudflare on every push to main.
#
# - The Cloudflare credentials exist only as secrets of the "production" environment, which accepts
#   deployments from main alone, and only the Deploy step reads them. The API token is account-owned and
#   limited to Editor on the segv-sh Worker (docs/DEPLOYMENT.md, "Deploying from GitHub Actions").
# - Checks, tests and the build run in a job with no secrets. The deploy job runs on a fresh runner and
#   executes only Wrangler, on the files that the build job produced.
# - Dependencies come from pnpm-lock.yaml, without install scripts and without a cache. pnpm is the release that
#   "packageManager" in package.json pins, installed by pnpm/action-setup.
# - Every action is pinned to a full commit SHA, and the GITHUB_TOKEN can only read the repository.
# - Pull requests run the same checks in the CI workflow (ci.yml).

name: Deploy

on:
  push:
    branches: [main]

permissions: {}

# One run at a time, in push order: a newer push replaces a run that is still waiting, and a deployment
# that has started is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format and lint
        run: pnpm run check

      - name: Type-check the tests
        run: |
          pnpm exec tsc --noEmit -p test/engine
          pnpm exec tsc --noEmit -p test/worker

      - name: Test
        run: pnpm test

      # qwik build also type-checks and lints the app.
      - name: Build
        run: pnpm run build

      - name: Check the Wrangler configuration
        run: pnpm exec wrangler deploy --dry-run

      - name: Upload the build
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist
            server
          # dist/.assetsignore keeps _worker.js and _routes.json out of the static assets.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://segv.sh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # By id, so that only the artifact this run's build job uploaded can be deployed.
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}

      # Runs Wrangler's binary itself, not through pnpm, so that no package-manager code (such as pnpm's check that
      # node_modules is up to date, which can start an install) runs with the credentials.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the production environment."
            exit 1
          fi
          node_modules/.bin/wrangler deploy --message "GitHub Actions: ${GITHUB_SHA}"

      # A 503 here means that a secret is missing or a variable is invalid (docs/DEPLOYMENT.md).
      - name: Check the deployment
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 5 --retry-all-errors --retry-delay 5 --max-time 10
          https://segv.sh/api/v2/params

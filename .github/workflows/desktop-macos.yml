# Builds the desktop app for macOS, signs it with the team's Developer ID, has Apple notarize it and publishes it
# (docs/DEVELOPMENT.md, "Releases"). One universal app, for Apple silicon and Intel:
#
# - Every push to main that changes the app builds segv.sh Canary (sh.segv.desktop.canary, which calls
#   https://canary.segv.sh), version X.Y.Z-canary.N (apps/desktop/scripts/version.mjs). It replaces the disk image of
#   the prerelease "canary", whose tag moves to the commit, so that
#   https://github.com/sizumita/segv.sh/releases/download/canary/segv.sh-Canary.dmg is always the latest one.
# - Every release tag vX.Y.Z, on main, builds segv.sh (sh.segv.desktop, which calls https://segv.sh), version X.Y.Z, and
#   publishes it as the tag's release: https://github.com/sizumita/segv.sh/releases/latest/download/segv.sh.dmg.
#
# - Three jobs. "build" compiles the app with no secret. "sign" runs in the environment that holds the signing secrets,
#   "canary" (main alone) or "production" (release tags alone), and runs only Tauri's CLI and Apple's tools: it bundles,
#   signs and notarizes the binary that "build" compiled. "publish" is the only job whose GITHUB_TOKEN may write to the
#   repository (the releases and the tag "canary"), and runs only the gh CLI.
# - Dependencies come from pnpm-lock.yaml, without install scripts and without a cache. Cargo takes the versions of
#   Cargo.lock. pnpm is the release that "packageManager" in package.json pins, installed by pnpm/action-setup.
# - Every action is pinned to a full commit SHA.

name: Desktop app for macOS

on:
  push:
    branches: [main]
    # GitHub does not apply the paths below to tags: every release tag builds.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - apps/desktop/**
      - packages/engine/**
      - packages/ui/**
      - packages/protocol/**
      - Cargo.lock
      - Cargo.toml
      - pnpm-lock.yaml
      - .github/workflows/desktop-macos.yml
  # From the Actions tab, on main (the Canary) or on a release tag (that release), to build again.
  workflow_dispatch:

permissions: {}

# One run at a time per ref, in push order: a newer push replaces a run that is still waiting, and a run that has
# started is never cancelled, so that a notarization or a publication is never left half done.
concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TARGET: universal-apple-darwin
  SEGV_CHANNEL: ${{ github.ref_type == 'tag' && 'release' || 'canary' }}

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # The whole history: the version counts commits.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the ref
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::${GITHUB_REF_NAME} is not a commit of main: a release is built only from main."
              exit 1
            fi
          elif [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "::error::segv.sh Canary is built only from main."
            exit 1
          fi

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Compute the version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            node apps/desktop/scripts/version.mjs release "${GITHUB_REF_NAME}" | tee -a "${GITHUB_OUTPUT}"
          else
            node apps/desktop/scripts/version.mjs canary | tee -a "${GITHUB_OUTPUT}"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Add the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # tauri build makes the pages first (beforeBuildCommand), for the deployment of the channel (scripts/bundle.mjs).
      - name: Build the app
        env:
          SEGV_VERSION: ${{ steps.version.outputs.version }}
          SEGV_BUILD: ${{ steps.version.outputs.build }}
        run: node apps/desktop/scripts/bundle.mjs --ci --target "${TARGET}" --no-bundle

      - name: Upload the binary
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: segv-desktop-macos-binary
          path: target/universal-apple-darwin/release/segv-desktop
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and notarize
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'canary' }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # Tauri's CLI, from the lockfile, for the bundle step.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # By id, so that only the binary this run's build job uploaded is signed. Artifacts lose the file mode.
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: target/universal-apple-darwin/release

      # scripts/prepare-signing.sh checks the secrets, so that a wrong one is named here rather than by a failure later,
      # and writes the profile and the API key to files. Tauri imports the certificate into a keychain of its own, signs the app with the entitlements and the provisioning profile (scripts/bundle.mjs), has
      # Apple notarize it and staples the ticket to it. It only signs the disk image, which this step then has notarized
      # and stapled too. The files are written to a directory that only this step uses, and deleted at its end. It runs
      # Node, the CLI's binary, OpenSSL and Apple's tools, not pnpm.
      - name: Bundle, sign and notarize
        env:
          SEGV_VERSION: ${{ needs.build.outputs.version }}
          SEGV_BUILD: ${{ needs.build.outputs.build }}
          APPLE_TEAM_ID: NBDP5VK335
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'canary' }}
          IDENTIFIER: ${{ github.ref_type == 'tag' && 'sh.segv.desktop' || 'sh.segv.desktop.canary' }}
        run: |
          missing=()
          for v in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY APPLE_PROVISIONING_PROFILE_BASE64; do
            [[ -n "${!v}" ]] || missing+=("${v}")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Set ${missing[*]} as secrets of the ${ENVIRONMENT} environment (docs/DEVELOPMENT.md, \"Releases\")."
            exit 1
          fi
          chmod +x target/universal-apple-darwin/release/segv-desktop
          dir="$(mktemp -d)"
          trap 'rm -rf "${dir}"' EXIT
          source apps/desktop/scripts/prepare-signing.sh "${dir}" "${IDENTIFIER}"
          node apps/desktop/scripts/bundle.mjs bundle --ci --target "${TARGET}" --bundles app,dmg
          dmg=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          result="$(xcrun notarytool submit "${dmg[0]}" --wait --output-format json \
            --key "${APPLE_API_KEY_PATH}" --key-id "${APPLE_API_KEY}" --issuer "${APPLE_API_ISSUER}")"
          echo "${result}"
          if [[ "$(jq -r .status <<<"${result}")" != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id <<<"${result}")" \
              --key "${APPLE_API_KEY_PATH}" --key-id "${APPLE_API_KEY}" --issuer "${APPLE_API_ISSUER}" || true
            echo "::error::Apple did not accept the disk image."
            exit 1
          fi
          xcrun stapler staple "${dmg[0]}"

      # What Gatekeeper checks when someone opens the download, and the entitlements that passkeys need.
      - name: Check the app
        env:
          HOST: ${{ github.ref_type == 'tag' && 'segv.sh' || 'canary.segv.sh' }}
        run: |
          app=(target/universal-apple-darwin/release/bundle/macos/*.app)
          dmg=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          entitlements="$(codesign --display --entitlements - --xml "${app[0]}")"
          if [[ "${entitlements}" != *"<string>webcredentials:${HOST}</string>"* ]]; then
            echo "::error::The app is not associated with ${HOST}: no passkeys."
            exit 1
          fi
          archs="$(lipo -archs "${app[0]}"/Contents/MacOS/segv-desktop)"
          echo "Architectures: ${archs}"
          [[ " ${archs} " == *" arm64 "* && " ${archs} " == *" x86_64 "* ]]
          spctl --assess --type execute --verbose=2 "${app[0]}"
          xcrun stapler validate "${app[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          mkdir dist
          cp "${dmg[0]}" "dist/$([[ "${SEGV_CHANNEL}" == canary ]] && echo segv.sh-Canary || echo segv.sh).dmg"

      - name: Upload the disk image
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: segv-desktop-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: dist

      # The release keeps its place: the disk image is replaced, the tag moved and the text changed in place, which
      # notifies nobody. The first run creates it.
      - name: Publish the Canary
        if: github.ref_type != 'tag'
        run: |
          title="segv.sh Canary ${VERSION}"
          notes="segv.sh Canary ${VERSION}, built from ${GITHUB_SHA} on main."
          notes+=" It calls https://canary.segv.sh, a deployment with accounts of its own, and installs next to segv.sh."
          notes+=" Not a release: it changes with every push to main that changes the app."
          if gh release view canary >/dev/null 2>&1; then
            gh release upload canary dist/segv.sh-Canary.dmg --clobber
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/canary" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit canary --prerelease --latest=false --title "${title}" --notes "${notes}"
          else
            gh release create canary dist/segv.sh-Canary.dmg --target "${GITHUB_SHA}" --prerelease --latest=false \
              --title "${title}" --notes "${notes}"
          fi

      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/segv.sh.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/segv.sh.dmg --verify-tag --title "segv.sh ${VERSION}" \
              --generate-notes
          fi

# Builds the desktop app for macOS and Windows and publishes it, with the feed that the published apps update from
# (docs/DEVELOPMENT.md, "Releases" and "Updates"). One universal app for macOS (Apple silicon and Intel), signed with the
# team's Developer ID and notarized by Apple, and an installer for Windows on x64 and one on ARM64, not signed yet.
#
# - Every push to main that changes the app builds segv.sh Canary (sh.segv.desktop.canary, which calls
#   https://canary.segv.sh), version X.Y.Z-canary.N (apps/desktop/scripts/version.mjs). It replaces the files of the
#   prerelease "canary", whose tag moves to the commit, so that
#   https://github.com/sizumita/segv.sh/releases/download/canary/<file> is always the latest one.
# - Every release tag vX.Y.Z, on main, builds segv.sh (sh.segv.desktop, which calls https://segv.sh), version X.Y.Z, and
#   publishes it as the tag's release: https://github.com/sizumita/segv.sh/releases/latest/download/<file>.
# - Each release carries latest.json, the feed of its channel: the version, and for each system the update package and
#   its signature, made with the channel's update key (TAURI_SIGNING_PRIVATE_KEY). The apps read it (apps/desktop/src-
#   tauri/src/update.rs) and install only a package that the key built into them verifies, for that version, when it is
#   newer than their own.
#
# - "version" counts the version from the history. "macos" and "windows" compile the app with no secret. "macos-sign"
#   and "windows-sign" run in the environment that holds the signing secrets, "canary" (main alone) or "production"
#   (release tags alone), and run only Tauri's CLI and the system's tools: they bundle the binary that the build jobs
#   compiled, sign it, have Apple notarize the macOS app, and sign the update packages. "publish" is the only job whose
#   GITHUB_TOKEN may write to the repository (the releases and the tag "canary"), and runs only the gh CLI and jq. It
#   uploads the feed last, once every file that it names is in place.
# - Dependencies come from pnpm-lock.yaml, without install scripts and without a cache. Cargo takes the versions of
#   Cargo.lock. pnpm is the release that "packageManager" in package.json pins, installed by pnpm/action-setup. Tauri's
#   CLI fetches NSIS and checks the files' hashes.
# - Every action is pinned to a full commit SHA.

name: Desktop app

on:
  push:
    branches: [main]
    # GitHub does not apply the paths below to tags: every release tag builds.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - apps/desktop/**
      - packages/engine/**
      - packages/ui/**
      - packages/protocol/**
      - Cargo.lock
      - Cargo.toml
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  # From the Actions tab, on main (the Canary) or on a release tag (that release), to build again.
  workflow_dispatch:

permissions: {}

# One run at a time per ref, in push order: a newer push replaces a run that is still waiting, and a run that has
# started is never cancelled, so that a notarization or a publication is never left half done.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SEGV_CHANNEL: ${{ github.ref_type == 'tag' && 'release' || 'canary' }}
  # The published apps update themselves (apps/desktop/scripts/bundle.mjs).
  SEGV_UPDATES: "1"
  # The files' names: segv.sh.dmg, segv.sh-x64-setup.exe… or segv.sh-Canary.dmg, segv.sh-Canary-x64-setup.exe…
  NAME: ${{ github.ref_type == 'tag' && 'segv.sh' || 'segv.sh-Canary' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      # The whole history: the version counts commits.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the ref
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::${GITHUB_REF_NAME} is not a commit of main: a release is built only from main."
              exit 1
            fi
          elif [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "::error::segv.sh Canary is built only from main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Compute the version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            node apps/desktop/scripts/version.mjs release "${GITHUB_REF_NAME}" | tee -a "${GITHUB_OUTPUT}"
          else
            node apps/desktop/scripts/version.mjs canary | tee -a "${GITHUB_OUTPUT}"
          fi

  macos:
    name: Build for macOS
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: universal-apple-darwin
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Add the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # tauri build makes the pages first (beforeBuildCommand), for the deployment of the channel (scripts/bundle.mjs).
      - name: Build the app
        env:
          SEGV_VERSION: ${{ needs.version.outputs.version }}
          SEGV_BUILD: ${{ needs.version.outputs.build }}
        run: node apps/desktop/scripts/bundle.mjs --ci --target "${TARGET}" --no-bundle

      - name: Upload the binary
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: segv-desktop-macos-binary
          path: target/universal-apple-darwin/release/segv-desktop
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build for Windows (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Add the Rust target
        run: rustup target add "${TARGET}"

      - name: Build the app
        env:
          SEGV_VERSION: ${{ needs.version.outputs.version }}
          SEGV_BUILD: ${{ needs.version.outputs.build }}
        run: node apps/desktop/scripts/bundle.mjs --ci --target "${TARGET}" --no-bundle

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: segv-desktop-windows-${{ matrix.arch }}-binary
          path: target/${{ matrix.target }}/release/segv-desktop.exe
          if-no-files-found: error
          retention-days: 1

  macos-sign:
    name: Sign and notarize for macOS
    needs: [version, macos]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'canary' }}
    env:
      TARGET: universal-apple-darwin
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # Tauri's CLI, from the lockfile, for the bundle step.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # By id, so that only the binary this run's build job uploaded is signed. Artifacts lose the file mode.
      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.macos.outputs.artifact-id }}
          path: target/universal-apple-darwin/release

      # Tauri imports the certificate into a keychain of its own, signs the app with the entitlements and the
      # provisioning profile (scripts/bundle.mjs), has Apple notarize it and staples the ticket to it, then packs that
      # app as the update package and signs the package with the update key. It only signs the disk image, which this
      # step then has notarized and stapled too. The profile and the API key are written to a directory that only this
      # step uses, and deleted at its end. It runs Node and the CLI's binary, not pnpm.
      - name: Bundle, sign and notarize
        env:
          SEGV_VERSION: ${{ needs.version.outputs.version }}
          SEGV_BUILD: ${{ needs.version.outputs.build }}
          APPLE_TEAM_ID: NBDP5VK335
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'canary' }}
        run: |
          missing=()
          for v in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY APPLE_PROVISIONING_PROFILE_BASE64 TAURI_SIGNING_PRIVATE_KEY; do
            [[ -n "${!v}" ]] || missing+=("${v}")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Set ${missing[*]} as secrets of the ${ENVIRONMENT} environment (docs/DEVELOPMENT.md, \"Releases\")."
            exit 1
          fi
          chmod +x target/universal-apple-darwin/release/segv-desktop
          dir="$(mktemp -d)"
          trap 'rm -rf "${dir}"' EXIT
          (umask 077
            base64 --decode <<<"${APPLE_PROVISIONING_PROFILE_BASE64}" >"${dir}/segv.provisionprofile"
            printf '%s\n' "${APPLE_API_PRIVATE_KEY}" >"${dir}/AuthKey_${APPLE_API_KEY}.p8")
          export APPLE_PROVISIONING_PROFILE="${dir}/segv.provisionprofile"
          export APPLE_API_KEY_PATH="${dir}/AuthKey_${APPLE_API_KEY}.p8"
          node apps/desktop/scripts/bundle.mjs bundle --ci --target "${TARGET}" --bundles app,dmg
          dmg=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          result="$(xcrun notarytool submit "${dmg[0]}" --wait --output-format json \
            --key "${APPLE_API_KEY_PATH}" --key-id "${APPLE_API_KEY}" --issuer "${APPLE_API_ISSUER}")"
          echo "${result}"
          if [[ "$(jq -r .status <<<"${result}")" != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id <<<"${result}")" \
              --key "${APPLE_API_KEY_PATH}" --key-id "${APPLE_API_KEY}" --issuer "${APPLE_API_ISSUER}" || true
            echo "::error::Apple did not accept the disk image."
            exit 1
          fi
          xcrun stapler staple "${dmg[0]}"

      # What Gatekeeper checks when someone opens the download, and the entitlements that passkeys need; and that the
      # update package holds the same app, signed and stapled.
      - name: Check the app
        env:
          HOST: ${{ github.ref_type == 'tag' && 'segv.sh' || 'canary.segv.sh' }}
        run: |
          app=(target/universal-apple-darwin/release/bundle/macos/*.app)
          dmg=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          update=(target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          entitlements="$(codesign --display --entitlements - --xml "${app[0]}")"
          if [[ "${entitlements}" != *"<string>webcredentials:${HOST}</string>"* ]]; then
            echo "::error::The app is not associated with ${HOST}: no passkeys."
            exit 1
          fi
          archs="$(lipo -archs "${app[0]}"/Contents/MacOS/segv-desktop)"
          echo "Architectures: ${archs}"
          [[ " ${archs} " == *" arm64 "* && " ${archs} " == *" x86_64 "* ]]
          spctl --assess --type execute --verbose=2 "${app[0]}"
          xcrun stapler validate "${app[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          unpacked="$(mktemp -d)"
          tar -xzf "${update[0]}" -C "${unpacked}"
          packed=("${unpacked}"/*.app)
          codesign --verify --deep --strict --verbose=2 "${packed[0]}"
          xcrun stapler validate "${packed[0]}"
          [[ -s "${update[0]}.sig" ]]
          mkdir dist
          cp "${dmg[0]}" "dist/${NAME}.dmg"
          cp "${update[0]}" "dist/${NAME}.app.tar.gz"
          cp "${update[0]}.sig" "dist/${NAME}.app.tar.gz.sig"

      - name: Upload the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: segv-desktop-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows-sign:
    name: Bundle for Windows (${{ matrix.arch }})
    needs: [version, windows]
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'canary' }}
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # Tauri's CLI, from the lockfile, for the bundle step.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: segv-desktop-windows-${{ matrix.arch }}-binary
          path: target/${{ matrix.target }}/release

      # The installer is the update package: Tauri signs it with the update key. It runs Node and the CLI's binary,
      # not pnpm.
      - name: Bundle
        env:
          SEGV_VERSION: ${{ needs.version.outputs.version }}
          SEGV_BUILD: ${{ needs.version.outputs.build }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'canary' }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::Set TAURI_SIGNING_PRIVATE_KEY as a secret of the ${ENVIRONMENT} environment (docs/DEVELOPMENT.md, \"Updates\")."
            exit 1
          fi
          node apps/desktop/scripts/bundle.mjs bundle --ci --target "${TARGET}" --bundles nsis
          setup=(target/"${TARGET}"/release/bundle/nsis/*-setup.exe)
          [[ -s "${setup[0]}.sig" ]]
          mkdir dist
          cp "${setup[0]}" "dist/${NAME}-${ARCH}-setup.exe"
          cp "${setup[0]}.sig" "dist/${NAME}-${ARCH}-setup.exe.sig"

      - name: Upload the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: segv-desktop-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [version, macos-sign, windows-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'canary' }}
    steps:
      - name: Download the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: segv-desktop-{macos,windows-x64,windows-arm64}
          merge-multiple: true
          path: dist

      # The feed (Tauri's static update manifest): each system's package at the release's own URL, and its signature.
      # The universal macOS app serves both of its architectures.
      - name: Write the feed
        run: |
          base="https://github.com/${GH_REPO}/releases/download/${TAG}"
          if [[ "${TAG}" == canary ]]; then
            notes="segv.sh Canary ${VERSION}, built from ${GITHUB_SHA} on main."
          else
            notes="segv.sh ${VERSION}: https://github.com/${GH_REPO}/releases/tag/${TAG}"
          fi
          entry() { jq -n --arg url "${base}/$1" --rawfile sig "dist/$1.sig" '{url: $url, signature: ($sig | rtrimstr("\n"))}'; }
          jq -n --arg version "${VERSION}" --arg notes "${notes}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson mac "$(entry "${NAME}.app.tar.gz")" \
            --argjson x64 "$(entry "${NAME}-x64-setup.exe")" \
            --argjson arm64 "$(entry "${NAME}-arm64-setup.exe")" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": $mac, "darwin-x86_64": $mac, "windows-x86_64": $x64, "windows-aarch64": $arm64}}' \
            >latest.json
          cat latest.json
          rm dist/*.sig
          ls -l dist

      # The release keeps its place: the files are replaced, the tag moved and the text changed in place, which
      # notifies nobody. The first run creates it.
      - name: Publish the Canary
        if: github.ref_type != 'tag'
        run: |
          title="segv.sh Canary ${VERSION}"
          notes="segv.sh Canary ${VERSION}, built from ${GITHUB_SHA} on main, for macOS and Windows."
          notes+=" It calls https://canary.segv.sh, a deployment with accounts of its own, installs next to segv.sh and"
          notes+=" updates itself from this prerelease. Not a release: it changes with every push to main that changes"
          notes+=" the app."
          if gh release view canary >/dev/null 2>&1; then
            gh release upload canary dist/* --clobber
            gh release upload canary latest.json --clobber
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/canary" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit canary --prerelease --latest=false --title "${title}" --notes "${notes}"
          else
            gh release create canary dist/* latest.json --target "${GITHUB_SHA}" --prerelease --latest=false \
              --title "${title}" --notes "${notes}"
          fi

      # gh publishes a new release once its files are uploaded, so the latest release's feed never names a missing file.
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release upload "${TAG}" latest.json --clobber
          else
            gh release create "${TAG}" dist/* latest.json --verify-tag --title "segv.sh ${VERSION}" --generate-notes
          fi

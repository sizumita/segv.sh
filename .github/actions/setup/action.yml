# Sets up Node.js 24 and the pnpm release that "packageManager" in package.json pins. Workflows run it after the
# checkout, as ./.github/actions/setup. (GitHub's `$/` form of that reference needs no checkout, but actionlint does
# not accept it yet.)
#
# The repository allows only actions created by GitHub (docs/DEPLOYMENT.md), so pnpm comes from the npm registry
# through npm itself, not from a setup action. npm verifies the registry signatures and provenance attestations of pnpm
# and of its native binary before pnpm goes on PATH. The only install script that runs is pnpm's own, which puts the
# native binary in place.
name: Set up Node.js and pnpm
description: Node.js 24 and the pnpm release that package.json pins, with its registry signatures verified.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false

    - name: Set up pnpm
      shell: bash
      run: | # zizmor: ignore[adhoc-packages,github-env] exact versions with verified signatures, and a fixed PATH entry
        version="$(node -p 'require("./package.json").packageManager.match(/^pnpm@([^+]+)/)[1]')"
        dir="${RUNNER_TEMP}/pnpm"
        mkdir -p "${dir}"
        printf '{"private":true,"dependencies":{"pnpm":"%s"},"allowScripts":{"pnpm@%s":true}}\n' \
          "${version}" "${version}" > "${dir}/package.json"
        npm install --prefix "${dir}" --no-audit --no-fund
        npm audit signatures --prefix "${dir}"
        echo "${dir}/node_modules/.bin" >> "${GITHUB_PATH}"

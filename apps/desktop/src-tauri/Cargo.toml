[package]
name = "segv-desktop"
version = "0.1.0"
description = "The segv.sh desktop app: @segv/ui in a web view, with passkeys, storage and notifications in native code (docs/PROTOCOL.md §11.14)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "segv_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
# The PRF salt of the Windows passkeys, tested on every system (src/passkey.rs).
sha2 = "0.10.9"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
# Tauri's own runtime, built with fewer workers (src/lib.rs), and the page's alarm on it (src/alarm.rs).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time"] }
# The system's TLS (Security.framework, SChannel) for the update feed and its packages, instead of rustls and ring.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "zip",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-authentication-services = "0.3.2"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[target.'cfg(windows)'.dependencies]
sha2 = "0.10.9"
# The WebView2 interfaces that Tauri hands out (src/background.rs): the version that Tauri uses.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Networking_WindowsWebServices",
  "Win32_Security_Cryptography",
  "Win32_System_Power",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6.1"
windows-version = "0.1.7"

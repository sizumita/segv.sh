[package]
name = "segv-desktop"
version = "0.1.0"
description = "The segv.sh desktop app: @segv/ui in a web view, with passkeys, storage and notifications in native code (docs/PROTOCOL.md §11.14)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "segv_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-authentication-services = "0.3.2"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
